# 此文件为ecat集成的配置文件，无此文件则下面均为无。
requires_core: ^1.0.0
dependencies: # 依赖的其他ecat集成的信息。可选项，默认无
  - artifactId: integration-ecat-core-ruoyi
    groupId: com.ecat
    version: ^1.0.0
  - artifactId: integration-env-data-manager
    groupId: com.ecat
    version: ^1.0.1
  - artifactId: integration-env-device-manager
    groupId: com.ecat
    version: ^1.0.1
  - artifactId: integration-env-device-calibration
    groupId: com.ecat
    version: ^1.2.0

web-platform: # 需要支持的web平台的能力。可选项，默认无
  ui: true # 是否支持web平台显示功能，必填项
  api: true # 是否支持web平台api功能，必填项
